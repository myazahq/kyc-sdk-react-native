// Gradle build for the Myaza KYC RN SDK's Android native piece — the Google ML Kit
// face detector, now a VisionCamera v5 **Nitro** HybridObject (was a v4
// FrameProcessorPlugin). Mirrors react-native-nitro-modules' Android build pattern:
// the nitrogen-generated C++ specs are compiled into a shared lib (KycSdkReactNative)
// via CMake, and the Kotlin impl (HybridMyazaFaceDetector) backs it.
//
// ML Kit stays Android-only (Gradle) — no GoogleMLKit CocoaPod on iOS — so the SDK
// still builds on Apple-Silicon iOS simulators (iOS uses Apple Vision).

buildscript {
  ext.kotlin_version = ext.has('kotlinVersion') ? ext.kotlinVersion : '1.9.24'
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
// Adds the nitrogen-generated Kotlin sources (HybridMyazaFaceDetectorSpec, FaceResult, …).
apply from: '../nitrogen/generated/android/KycSdkReactNative+autolinking.gradle'

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace 'co.myazahq.kyc.rn'
  compileSdk safeExtGet('compileSdkVersion', 34)
  ndkVersion safeExtGet('ndkVersion', '27.1.12297006')

  defaultConfig {
    minSdk safeExtGet('minSdkVersion', 24)
    targetSdk safeExtGet('targetSdkVersion', 34)

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared"
        abiFilters(*reactNativeArchitectures())
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  buildFeatures {
    prefab true
    buildConfig true
  }

  // Don't bundle the shared libs already provided by the host app / RN.
  packagingOptions {
    excludes = [
      "META-INF",
      "META-INF/**",
      "**/libc++_shared.so",
      "**/libfbjni.so",
      "**/libjsi.so",
      "**/libreactnative.so",
      "**/libreactnativejni.so",
    ]
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

  // JPEG 2000 for the DG2 chip portrait — BitmapFactory cannot decode it and
  // never will; JJ2000 is the pure-Java reference implementation. ~500KB.
  implementation 'edu.ucar:jj2000:5.2'
  implementation 'com.facebook.react:react-android'

  // Nitro core — provides the HybridObject base + the NitroModules prefab the
  // generated CMake links against (find_package(react-native-nitro-modules)).
  implementation project(':react-native-nitro-modules')

  // VisionCamera — provides the Nitro `HybridFrameSpec` + `NativeFrame` (ImageProxy)
  // the detector reads, plus its C++ prefab (headers for the generated spec).
  // `implementation` (not compileOnly) so the prefab is consumable by our CMake.
  implementation project(':react-native-vision-camera')

  // CameraX core — for the ImageProxy / ExperimentalGetImage APIs.
  compileOnly 'androidx.camera:camera-core:1.3.4'

  // ── ML Kit: models fetched on demand by default ──────────────────────────
  //
  // Two variants of the same API exist. The `com.google.mlkit:*` artifacts embed
  // the models in the APK; the `com.google.android.gms:play-services-mlkit-*`
  // ones fetch them through Google Play Services on first use.
  //
  // Measured on a real integrator's release APK, the bundled pair cost
  // **18.5 MB per device** (arm64: ocr_pipeline 10.55 MB + face_detector 7.95 MB)
  // plus the .tflite files in assets/, which ship to EVERY device because assets
  // are not split by ABI. Unbundled, that is ~0.4 MB of shims.
  //
  // The trade-off is real and is why the flag exists: the unbundled variants need
  // Google Play Services, so they do not work on Huawei or AOSP builds without
  // GMS. An org shipping to those devices sets `myazaKycBundledMlKit = true` in
  // its root build.gradle ext and gets today's fully-offline behaviour back.
  //
  // Availability is NOT inferred per frame — `isModelReady()` is checked once
  // before the camera opens (see HybridMyazaFaceDetector.kt), because a missing
  // model would otherwise be indistinguishable from "no face in frame".
  if (safeExtGet('myazaKycBundledMlKit', false).toString().toBoolean()) {
    implementation 'com.google.mlkit:face-detection:16.1.6'
  } else {
    implementation 'com.google.android.gms:play-services-mlkit-face-detection:17.1.0'
  }

  // Text recognition is STILL BUNDLED, deliberately, and it is the larger of the
  // two (10.55 MB vs 7.95 MB on arm64) — so this is the bigger half of the win,
  // deferred rather than abandoned.
  //
  // Unbundling it needs the same isModelReady()/prepareModel() contract the face
  // detector just gained. Without that, a missing OCR model is indistinguishable
  // from "no text in frame": document auto-capture would simply never fire and
  // MRZ scanning would never produce a key for the chip read, with nothing shown
  // to the user. Shipping the dependency swap ahead of the availability handling
  // would trade 10 MB for a silent failure on every fresh install.
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
